<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo morado -->
  <rect width="100" height="100" rx="25" fill="#7C3AED" />
  
  <!-- Sol giratorio (detrás de la nube) -->
  <g stroke="#FCD34D" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 70 35; 360 70 35" dur="15s" repeatCount="indefinite" />
    <circle cx="70" cy="35" r="18" fill="#FBBF24" stroke="none" />
    <!-- Rayos -->
    <line x1="70" y1="13" x2="70" y2="6" />
    <line x1="70" y1="57" x2="70" y2="64" />
    <line x1="48" y1="35" x2="41" y2="35" />
    <line x1="92" y1="35" x2="99" y2="35" />
    <line x1="54.4" y1="19.4" x2="49.5" y2="14.5" />
    <line x1="85.6" y1="50.6" x2="90.5" y2="55.5" />
    <line x1="54.4" y1="50.6" x2="49.5" y2="55.5" />
    <line x1="85.6" y1="19.4" x2="90.5" y2="14.5" />
  </g>

  <!-- Nube grande flotando (delante del sol) -->
  <g fill="#FFFFFF">
    <animateTransform attributeName="transform" type="translate" values="0,3; 0,-3; 0,3" dur="4s" repeatCount="indefinite" />
    <!-- Círculos de la nube -->
    <circle cx="32" cy="58" r="18" />
    <circle cx="55" cy="46" r="26" />
    <circle cx="75" cy="56" r="20" />
    <!-- Relleno inferior para aplanar la base -->
    <rect x="32" y="50" width="43" height="26" />
  </g>
</svg>
