<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Estación Meteorológica</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css(v='2.19')}" href="../static/css/dashboard.css">
    <link rel="stylesheet" th:href="@{/css/components.css(v='1.0')}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet' />
</head>
<body class="theme-light">
<div class="dashboard-container">
    <aside th:replace="~{fragments/components :: sidebar(activePage='inicio')}"></aside>
    <main class="main-area">
        <header th:replace="~{fragments/components :: topNav(pageTitle='Inicio')}"></header>
        <div class="dashboard-content-area">
            <div class="forecast-bar">
                <div class="forecast-header">
                    <h2 class="forecast-title">Pronóstico</h2>
                    <div class="temp-toggle">
                        <button class="toggle-btn active">°C</button>
                        <button class="toggle-btn">°F</button>
                    </div>
                </div>
                <div class="forecast-days" id="forecastDaysContainer">
                </div>
            </div>
            <div class="map-view-card">
                <div id="map-root"></div>
                <button class="expand-map-btn" id="expandMapBtn" title="Maximizar mapa" onclick="toggleMapExpansion()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                </button>
                <div class="map-style-switcher">
                    <button class="style-btn active" data-style="mapbox://styles/mapbox/outdoors-v12">Relieve</button>
                    <button class="style-btn" data-style="mapbox://styles/mapbox/light-v11">Claro</button>
                    <button class="style-btn" data-style="mapbox://styles/mapbox/dark-v11">Oscuro</button>
                    <button class="style-btn" data-style="mapbox://styles/mapbox/satellite-streets-v12">Satelital</button>
                </div>
            </div>
            <div class="dashboard-bottom-grid">
                <div class="dashboard-left-column">
                <div class="owm-card weather-card" id="weatherCard">
                    <div class="weather-photo-header" id="weatherPhotoHeader">
                        <button class="nav-arrow prev" onclick="navigateStation(-1, event)" title="Estación anterior">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <button class="nav-arrow next" onclick="navigateStation(1, event)" title="Siguiente estación">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                        <div class="weather-header-top">
                            <div class="station-meta">
                                <h2 id="activeStationName">--</h2>
                                <span id="activeStationCode" class="station-code">EST-XXX</span>
                            </div>
                            <span id="activeTime" class="weather-time">--:--</span>
                        </div>
                        <div class="weather-header-bottom">
                            <div class="weather-temp-group">
                                <span class="weather-temp" id="activeTemp">--</span>
                                <span class="weather-unit">°C</span>
                            </div>
                            <div class="weather-status-group">
                                <span class="weather-status-text" id="activeStatusText">Cargando...</span>
                                <span class="weather-status-feels" id="activeFeels">Sensación: --</span>
                            </div>
                        </div>
                    </div>
                    <div class="weather-metrics-grid">
                        <div class="metric-box">
                            <span class="metric-icon">🌬️</span>
                            <div class="metric-info">
                                <span class="metric-title">Viento</span>
                                <span class="metric-value" id="activeWind">--</span>
                            </div>
                        </div>
                        <div class="metric-box">
                            <span class="metric-icon">💧</span>
                            <div class="metric-info">
                                <span class="metric-title">Hum. Aire</span>
                                <span class="metric-value" id="activeHum">--</span>
                            </div>
                        </div>
                        <div class="metric-box">
                            <span class="metric-icon">🌱</span>
                            <div class="metric-info">
                                <span class="metric-title">Hum. Suelo</span>
                                <span class="metric-value" id="activeSoil">--</span>
                            </div>
                        </div>
                        <div class="metric-box">
                            <span class="metric-icon">⏲️</span>
                            <div class="metric-info">
                                <span class="metric-title">Presión</span>
                                <span class="metric-value" id="activePressure">--</span>
                            </div>
                        </div>
                        <div class="metric-box">
                            <span class="metric-icon">☔</span>
                            <div class="metric-info">
                                <span class="metric-title">Precipitación</span>
                                <span class="metric-value" id="activeRain">--</span>
                            </div>
                        </div>
                        <div class="metric-box">
                            <span class="metric-icon">🧭</span>
                            <div class="metric-info">
                                <span class="metric-title">Dir. Viento</span>
                                <span class="metric-value" id="activeWindDir">--</span>
                            </div>
                        </div>
                    </div>
                    </div>
                    <div class="owm-card lifestyle-card" id="lifestyleWidget">
                        <div class="ls-icon-container">
                            <div class="ls-icon-wrapper" id="lsIconWrapper">
                                <span class="ls-icon" id="lsIcon">☀️</span>
                            </div>
                        </div>
                        <div class="ls-content">
                            <h4 id="lsTitle">Día Agradable</h4>
                            <p id="lsDesc">Condiciones ideales para actividades al aire libre. ¡Disfruta el día!</p>
                        </div>
                    </div>
                </div>
                <div class="charts-split-container">
                    <div class="owm-card trend-chart-card">
                        <div class="card-header-compact">
                            <h3>🌡️ Temperatura</h3>
                            <div class="chart-legend-indicator">
                                <span class="legend-dot temp"></span> °C
                            </div>
                        </div>
                        <div class="chart-container-wrapper">
                            <div id="tempTrendChart" style="height: 200px; min-height: 200px; width: 100%;"></div>
                        </div>
                    </div>
                    <div class="owm-card trend-chart-card">
                        <div class="card-header-compact">
                            <h3>💧 Humedad</h3>
                            <div class="chart-legend-indicator">
                                <span class="legend-dot hum"></span> %
                            </div>
                        </div>
                        <div class="chart-container-wrapper">
                            <div id="humTrendChart" style="height: 200px; min-height: 200px; width: 100%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script th:inline="javascript">
    window.estacionesData = /*[[${estaciones}]]*/ [];
    window.mapboxApiKey = /*[[${mapboxApiKey}]]*/ '';
    function toggleMapExpansion() {
        const isExpanded = document.body.classList.toggle('map-fullscreen');
        const expandBtn = document.getElementById('expandMapBtn');
        if (expandBtn) {
            if (isExpanded) {
                expandBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
                `;
                expandBtn.title = "Contraer mapa";
            } else {
                expandBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                `;
                expandBtn.title = "Maximizar mapa";
            }
        }
        if (window.map) {
            setTimeout(() => {
                window.map.resize();
            }, 180);
        }
    }
</script>
<script th:src="@{/js/notificaciones.js(v='1.2')}"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script th:src="@{/js/dashboard.js(v='2.18')}"></script>
</body>
</html>
